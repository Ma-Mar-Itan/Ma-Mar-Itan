<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <style>
    @keyframes orbA { to { offset-distance: 100%; } }
    @keyframes drift { to { stroke-dashoffset: -420; } }
    @keyframes pulseRing { 0% { r: 9; opacity: .55; } 100% { r: 26; opacity: 0; } }
    @keyframes breathe { 0%,100% { r: 170; opacity: 1; } 50% { r: 188; opacity: .7; } }
    @keyframes ringFade { 0%,100% { stroke-opacity: .95; } 50% { stroke-opacity: .45; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e6edf3; } }
  </style>
  <title id="title">Research Orbit</title>
  <desc id="desc">An animated research system with Artificial Intelligence, Statistics, Quant Finance, and Computational Infrastructure orbiting a Research Orbit nucleus.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf7"></stop>
      <stop offset="0.52" stop-color="#f6f3ed"></stop>
      <stop offset="1" stop-color="#ece7dd"></stop>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.85">
      <stop stop-color="#d29922" stop-opacity=".10"></stop>
      <stop offset="0.6" stop-color="#d29922" stop-opacity=".04"></stop>
      <stop offset="1" stop-color="#d29922" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="aura">
      <stop stop-color="#d29922" stop-opacity=".10"></stop>
      <stop offset=".38" stop-color="#d29922" stop-opacity=".04"></stop>
      <stop offset="1" stop-color="#d29922" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="metalSheen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8e8" stop-opacity="0"></stop>
      <stop offset=".38" stop-color="#fff8e8" stop-opacity=".16"></stop>
      <stop offset=".5" stop-color="#d7b978" stop-opacity=".9"></stop>
      <stop offset=".62" stop-color="#fff8e8" stop-opacity=".12"></stop>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="700" cy="360" r="70"></circle></clipPath>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <path id="orbitA" d="M250 360 A450 155 0 1 1 1150 360 A450 155 0 1 1 250 360"></path>
    <path id="orbitB" d="M700 55 A180 305 0 1 1 700 665 A180 305 0 1 1 700 55"></path>
    <path id="orbitC" d="M340 130 A430 190 32 1 1 1060 590 A430 190 32 1 1 340 130"></path>
    <path id="orbitD" d="M340 590 A430 190 -32 1 1 1060 130 A430 190 -32 1 1 340 590"></path>
  </defs>

  <rect width="1400" height="720" fill="none"></rect>

  <g fill="#8b949e">
    <circle cx="88" cy="108" r="1.4" style="animation:twinkle 4.2s ease-in-out infinite"></circle>
    <circle cx="178" cy="596" r="1.1" style="animation:twinkle 5.6s ease-in-out infinite .8s"></circle>
    <circle cx="298" cy="66" r="1.2" style="animation:twinkle 3.4s ease-in-out infinite 1.4s"></circle>
    <circle cx="1260" cy="103" r="1.3" style="animation:twinkle 6.1s ease-in-out infinite .3s"></circle>
    <circle cx="1322" cy="582" r="1.1" style="animation:twinkle 4.8s ease-in-out infinite 2.1s"></circle>
    <circle cx="1135" cy="660" r="1.3" style="animation:twinkle 3.9s ease-in-out infinite 1.1s"></circle>
    <circle cx="425" cy="642" r="1" style="animation:twinkle 5.2s ease-in-out infinite 2.6s"></circle>
  </g>

  <g stroke-width="1.7">
    <path d="M250 360 A450 155 0 1 1 1150 360 A450 155 0 1 1 250 360" stroke="#388bfd" stroke-opacity=".46" stroke-dasharray="8 13" style="fill:none;animation:drift 21s linear infinite"></path>
    <path d="M700 55 A180 305 0 1 1 700 665 A180 305 0 1 1 700 55" stroke="#a371f7" stroke-opacity=".42" stroke-dasharray="5 12" style="fill:none;animation:drift 17s linear infinite reverse"></path>
    <path d="M340 130 A430 190 32 1 1 1060 590 A430 190 32 1 1 340 130" stroke="#3fb950" stroke-opacity=".42" stroke-dasharray="11 15" style="fill:none;animation:drift 26s linear infinite"></path>
    <path d="M340 590 A430 190 -32 1 1 1060 130 A430 190 -32 1 1 340 590" stroke="#d29922" stroke-opacity=".44" stroke-dasharray="6 15" style="fill:none;animation:drift 21s linear infinite reverse"></path>
  </g>


  <g>
    <circle cx="700" cy="360" r="170" fill="url(#aura)" style="animation:breathe 7s ease-in-out infinite"></circle>
    <circle cx="700" cy="360" r="103" fill="none" stroke="#8b949e" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2 6"></circle>
    <circle cx="700" cy="360" r="91" fill="none" stroke="#d29922" stroke-opacity=".55" stroke-width="1.4" style="animation:ringFade 5.5s ease-in-out infinite"></circle>
    <circle cx="700" cy="360" r="68" fill="url(#core)" stroke="#d29922" stroke-opacity=".8" stroke-width="2"></circle>
    <g clip-path="url(#planetClip)">
      <circle cx="700" cy="360" r="53" fill="none" stroke="#d29922" stroke-opacity=".38" stroke-width="7" stroke-linecap="round" stroke-dasharray="58 276" style="transform-origin:700px 360px;animation:spin 9s linear infinite"></circle>
    </g>
    <text x="700" y="337" text-anchor="middle" fill="#6e7781" font-size="14" font-weight="700" letter-spacing="4.2">RESEARCH</text>
    <line x1="672" y1="351" x2="728" y2="351" stroke="#d29922" stroke-opacity=".7" stroke-width="1"></line>
    <text x="700" y="383" text-anchor="middle" class="ink" fill="#1f2328" font-family="Georgia, serif" font-size="29" font-weight="600" letter-spacing="2.2">ORBIT</text>
  </g>

  <g style="offset-path:path('M250 360 A450 155 0 1 1 1150 360 A450 155 0 1 1 250 360');offset-rotate:0deg;animation:orbA 26s linear infinite">
    <circle r="9" fill="none" stroke="#388bfd" stroke-width="1.6" opacity="0" style="animation:pulseRing 3.6s ease-out infinite"></circle>
    <circle r="9" fill="#388bfd" filter="url(#glow)"></circle>
    <text x="21" y="5" fill="#0969da" font-size="12" font-weight="800" letter-spacing=".55">ARTIFICIAL INTELLIGENCE</text>
  </g>
  <g style="offset-path:path('M700 55 A180 305 0 1 1 700 665 A180 305 0 1 1 700 55');offset-rotate:0deg;animation:orbA 19s linear infinite -7s">
    <circle r="9" fill="none" stroke="#a371f7" stroke-width="1.6" opacity="0" style="animation:pulseRing 3.6s ease-out infinite .9s"></circle>
    <circle r="9" fill="#a371f7" filter="url(#glow)"></circle>
    <text x="21" y="5" fill="#8250df" font-size="12" font-weight="800" letter-spacing=".7">STATISTICS</text>
  </g>
  <g style="offset-path:path('M340 130 A430 190 32 1 1 1060 590 A430 190 32 1 1 340 130');offset-rotate:0deg;animation:orbA 31s linear infinite -19s">
    <circle r="9" fill="none" stroke="#3fb950" stroke-width="1.6" opacity="0" style="animation:pulseRing 3.6s ease-out infinite 1.8s"></circle>
    <circle r="9" fill="#3fb950" filter="url(#glow)"></circle>
    <text x="21" y="5" fill="#1a7f37" font-size="12" font-weight="800" letter-spacing=".6">QUANT FINANCE</text>
  </g>
  <g style="offset-path:path('M340 590 A430 190 -32 1 1 1060 130 A430 190 -32 1 1 340 590');offset-rotate:0deg;animation:orbA 23s linear infinite -4s">
    <circle r="9" fill="none" stroke="#d29922" stroke-width="1.6" opacity="0" style="animation:pulseRing 3.6s ease-out infinite 2.7s"></circle>
    <circle r="9" fill="#d29922" filter="url(#glow)"></circle>
    <text x="21" y="5" fill="#9a6700" font-size="12" font-weight="800" letter-spacing=".45">COMPUTATIONAL INFRASTRUCTURE</text>
  </g>

</svg>