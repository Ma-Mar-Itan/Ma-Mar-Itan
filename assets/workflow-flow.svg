<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="t d">
  <title id="t">Metadata-driven scientific workflow</title><desc id="d">Tasks flow through metadata generation, scheduling, heterogeneous compute, validation, and reporting.</desc>
  <defs>
    <linearGradient id="b" x2="1" y2="1"><stop stop-color="#090e19"/><stop offset="1" stop-color="#141126"/></linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="p1" d="M188 150H282"/><path id="p2" d="M438 150H532"/><path id="p3" d="M688 150H782"/><path id="p4" d="M908 150H976"/>
