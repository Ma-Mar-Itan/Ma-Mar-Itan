  </defs>
  <rect width="1080" height="300" rx="20" fill="url(#b)"/><rect x="1" y="1" width="1078" height="298" rx="19" fill="none" stroke="#334155"/>
  <text x="42" y="45" fill="#f8fafc" font-size="20" font-weight="700">Logical petabyte scale · physical laptop scale</text><text x="42" y="69" fill="#94a3b8" font-size="13">Metadata-only discrete-event simulation for controlled scheduler comparison</text>
