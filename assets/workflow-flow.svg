  </g>
  <g fill="#f8fafc" text-anchor="middle"><text x="113" y="139" font-size="14" font-weight="700">WORKLOAD</text><text x="113" y="160" fill="#94a3b8" font-size="11">task metadata</text><text x="113" y="177" fill="#94a3b8" font-size="11">GB → PB logical scale</text><text x="360" y="139" font-size="14" font-weight="700">SCHEDULER</text><text x="360" y="160" fill="#94a3b8" font-size="11">policy · queue · priority</text><text x="610" y="128" font-size="14" font-weight="700">COMPUTE</text><text x="610" y="181" fill="#94a3b8" font-size="11">CPU · GPU · memory · I/O</text><text x="845" y="139" font-size="14" font-weight="700">VALIDATE</text><text x="845" y="160" fill="#94a3b8" font-size="11">compare policies</text><text x="1012" y="139" font-size="12" font-weight="700">REPORT</text></g>
  <g transform="translate(562 146)"><rect width="30" height="18" rx="4" fill="#15243a" stroke="#6ee7b7"/><rect x="38" width="30" height="18" rx="4" fill="#15243a" stroke="#6ee7b7"/><rect x="76" width="30" height="18" rx="4" fill="#15243a" stroke="#6ee7b7"/><g fill="#6ee7b7"><rect x="4" y="13" width="22" height="2"><animate attributeName="width" values="4;22;4" dur="2s" repeatCount="indefinite"/></rect><rect x="42" y="13" width="22" height="2"><animate attributeName="width" values="4;22;4" dur="2.4s" begin="-.8s" repeatCount="indefinite"/></rect><rect x="80" y="13" width="22" height="2"><animate attributeName="width" values="4;22;4" dur="1.8s" begin="-.4s" repeatCount="indefinite"/></rect></g></g>
