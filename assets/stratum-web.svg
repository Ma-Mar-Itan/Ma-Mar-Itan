<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050607"></stop>
      <stop offset="45%" stop-color="#101214"></stop>
      <stop offset="100%" stop-color="#111315"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.14"></stop>
      <stop offset="40%" stop-color="#6b7280" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="fadeToWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.68"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"></stop>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.6" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .grid {
        stroke: #374151;
        stroke-width: 1;
        opacity: 0.14;
      }

      .edge {
        stroke: #9ca3af;
        stroke-width: 1.1;
        stroke-opacity: 0.28;
        stroke-dasharray: 8 16;
      }

      .edge-soft {
        stroke: #6b7280;
        stroke-width: 1;
        stroke-opacity: 0.14;
        stroke-dasharray: 5 18;
      }

      .node {
        fill: #d1d5db;
        opacity: 0.84;
        filter: url(#softGlow);
      }

      .node-muted {
        fill: #9ca3af;
        opacity: 0.42;
      }

      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 72px;
        font-weight: 780;
        letter-spacing: 0.2px;
        fill: #f3f4f6;
      }

      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 2.4px;
        fill: #d1d5db;
      }

      .tag {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 1.3px;
        fill: #9ca3af;
      }

      .micro {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 1.2px;
        fill: #6b7280;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="420" fill="url(#bg)"></rect>
  <rect width="1600" height="420" fill="url(#glow)"></rect>

  <!-- subtle grid -->
  <g>
    <path class="grid" d="M0 84H1600"></path>
    <path class="grid" d="M0 168H1600"></path>
    <path class="grid" d="M0 252H1600"></path>
    <path class="grid" d="M0 336H1600"></path>
    <path class="grid" d="M220 0V420"></path>
    <path class="grid" d="M500 0V420"></path>
    <path class="grid" d="M800 0V420"></path>
    <path class="grid" d="M1100 0V420"></path>
    <path class="grid" d="M1380 0V420"></path>
  </g>

  <!-- network -->
  <g>
    <path class="edge" d="M120 110 L310 165 L500 100 L725 185 L935 118 L1175 176 L1490 106">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="12s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge" d="M95 292 L310 165 L545 300 L725 185 L980 295 L1175 176 L1510 286">
      <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="15s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M120 110 L545 300 L935 118 L1510 286">
      <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="18s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M95 292 L500 100 L980 295 L1490 106">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="20s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M310 165 L725 185 L1175 176">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="14s" repeatCount="indefinite"></animate>
    </path>

    <circle class="node" cx="120" cy="110" r="4">
      <animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="310" cy="165" r="5">
      <animate attributeName="r" values="5;8;5" dur="5.5s" begin="0.4s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="500" cy="100" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.2s" begin="0.9s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="725" cy="185" r="6">
      <animate attributeName="r" values="6;10;6" dur="4.8s" begin="0.2s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="935" cy="118" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.8s" begin="1s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="1175" cy="176" r="5">
      <animate attributeName="r" values="5;8;5" dur="5.2s" begin="0.6s" repeatCount="indefinite"></animate>
    </circle>
    <circle class="node" cx="1490" cy="106" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.6s" begin="1.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node-muted" cx="95" cy="292" r="3"></circle>
    <circle class="node-muted" cx="545" cy="300" r="3"></circle>
    <circle class="node-muted" cx="980" cy="295" r="3"></circle>
    <circle class="node-muted" cx="1510" cy="286" r="3"></circle>
  </g>

  <!-- central text panel -->
  <rect x="315" y="110" width="970" height="170" rx="6" fill="#050607" opacity="0.52"></rect>
  <rect x="315" y="110" width="970" height="170" rx="6" stroke="#374151" stroke-opacity="0.4"></rect>

  <text x="800" y="188" text-anchor="middle" class="title">Malek M. Itani</text>
  <text x="800" y="230" text-anchor="middle" class="subtitle">APPLIED STATISTICS · COMPLEX SYSTEMS · AI RESEARCH</text>
  <text x="800" y="264" text-anchor="middle" class="tag">DATA-GENERATING PROCESSES · LATENT STRUCTURE · REGIME CHANGE</text>

  <text x="70" y="360" class="micro">SYSTEM STATE: PARTIALLY OBSERVED</text>
  <text x="1235" y="360" class="micro">INFERENCE UNDER NONSTATIONARITY</text>

  <!-- white fade overlay -->
  <rect x="0" y="0" width="1600" height="420" fill="url(#fadeToWhite)"></rect>
</svg>
