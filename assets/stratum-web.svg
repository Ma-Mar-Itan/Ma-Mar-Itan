<svg width="1600" height="360" viewBox="0 0 1600 360" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050607"></stop>
      <stop offset="45%" stop-color="#101214"></stop>
      <stop offset="100%" stop-color="#070809"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.13"></stop>
      <stop offset="45%" stop-color="#6b7280" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .grid {
        stroke: #374151;
        stroke-width: 1;
        opacity: 0.16;
      }

      .edge {
        stroke: #9ca3af;
        stroke-width: 1.15;
        stroke-opacity: 0.30;
        stroke-dasharray: 8 16;
      }

      .edge-soft {
        stroke: #6b7280;
        stroke-width: 1;
        stroke-opacity: 0.14;
        stroke-dasharray: 5 18;
      }

      .node {
        fill: #d1d5db;
        opacity: 0.85;
        filter: url(#nodeGlow);
      }

      .node-muted {
        fill: #9ca3af;
        opacity: 0.42;
      }

      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 72px;
        font-weight: 780;
        letter-spacing: 0.2px;
        fill: #f3f4f6;
      }

      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 2.6px;
        fill: #c7cbd1;
      }

      .tag {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 1.4px;
        fill: #9ca3af;
      }

      .micro {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 1.3px;
        fill: #6b7280;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="360" fill="url(#bg)"></rect>
  <rect width="1600" height="360" fill="url(#glow)"></rect>

  <!-- Grid -->
  <g>
    <path class="grid" d="M0 72H1600"></path>
    <path class="grid" d="M0 144H1600"></path>
    <path class="grid" d="M0 216H1600"></path>
    <path class="grid" d="M0 288H1600"></path>
    <path class="grid" d="M220 0V360"></path>
    <path class="grid" d="M500 0V360"></path>
    <path class="grid" d="M800 0V360"></path>
    <path class="grid" d="M1100 0V360"></path>
    <path class="grid" d="M1380 0V360"></path>
  </g>

  <!-- Network web -->
  <g>
    <path class="edge" d="M100 92 L285 135 L470 86 L690 160 L900 96 L1135 150 L1500 80">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="12s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge" d="M80 260 L285 135 L515 270 L690 160 L955 255 L1135 150 L1520 252">
      <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="15s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M100 92 L515 270 L900 96 L1520 252">
      <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="18s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M80 260 L470 86 L955 255 L1500 80">
      <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="20s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M285 135 L690 160 L1135 150">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="14s" repeatCount="indefinite"></animate>
    </path>

    <!-- Nodes -->
    <circle class="node" cx="100" cy="92" r="4">
      <animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="285" cy="135" r="5">
      <animate attributeName="r" values="5;8;5" dur="5.5s" begin="0.4s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="470" cy="86" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.2s" begin="0.9s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="690" cy="160" r="6">
      <animate attributeName="r" values="6;10;6" dur="4.8s" begin="0.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="900" cy="96" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.8s" begin="1s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="1135" cy="150" r="5">
      <animate attributeName="r" values="5;8;5" dur="5.2s" begin="0.6s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="1500" cy="80" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.6s" begin="1.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node-muted" cx="80" cy="260" r="3"></circle>
    <circle class="node-muted" cx="515" cy="270" r="3"></circle>
    <circle class="node-muted" cx="955" cy="255" r="3"></circle>
    <circle class="node-muted" cx="1520" cy="252" r="3"></circle>
  </g>

  <!-- Central panel -->
  <rect x="300" y="92" width="1000" height="170" rx="4" fill="#050607" opacity="0.68"></rect>
  <rect x="300" y="92" width="1000" height="170" rx="4" stroke="#374151" stroke-opacity="0.55"></rect>

  <!-- Text -->
  <text x="800" y="164" text-anchor="middle" class="title">Malek M. Itani</text>
  <text x="800" y="205" text-anchor="middle" class="subtitle">APPLIED STATISTICS · COMPLEX SYSTEMS · AI RESEARCH</text>
  <text x="800" y="240" text-anchor="middle" class="tag">DATA-GENERATING PROCESSES · LATENT STRUCTURE · REGIME CHANGE</text>

  <!-- Corner system labels -->
  <text x="70" y="322" class="micro">SYSTEM STATE: PARTIALLY OBSERVED</text>
  <text x="1240" y="322" class="micro">INFERENCE UNDER NONSTATIONARITY</text>

  <!-- Bottom geometry -->
  <path d="M0 327 C300 304 515 346 800 322 C1085 300 1280 342 1600 315 V360 H0 Z" fill="#14171a" opacity="0.88"></path>

</svg>
