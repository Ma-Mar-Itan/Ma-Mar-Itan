<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090b"></stop>
      <stop offset="45%" stop-color="#111315"></stop>
      <stop offset="100%" stop-color="#0b0d0f"></stop>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.12"></stop>
      <stop offset="45%" stop-color="#9ca3af" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .edge {
        stroke: #9ca3af;
        stroke-width: 1;
        stroke-opacity: 0.28;
        stroke-dasharray: 7 14;
      }

      .edge-soft {
        stroke: #6b7280;
        stroke-width: 1;
        stroke-opacity: 0.16;
        stroke-dasharray: 4 18;
      }

      .node {
        fill: #d1d5db;
        opacity: 0.78;
        filter: url(#softGlow);
      }

      .node-muted {
        fill: #9ca3af;
        opacity: 0.48;
      }

      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 58px;
        font-weight: 750;
        letter-spacing: 0.5px;
        fill: #e5e7eb;
      }

      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 1.8px;
        fill: #c7cbd1;
      }

      .caption {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 1.4px;
        fill: #9ca3af;
      }

      .micro {
        font-family: JetBrains Mono, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.2px;
        fill: #6b7280;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"></rect>
  <rect width="1600" height="420" fill="url(#coreGlow)"></rect>

  <!-- Subtle grid -->
  <g opacity="0.16">
    <path d="M0 80H1600" stroke="#6b7280" stroke-width="1"></path>
    <path d="M0 160H1600" stroke="#6b7280" stroke-width="1"></path>
    <path d="M0 240H1600" stroke="#6b7280" stroke-width="1"></path>
    <path d="M0 320H1600" stroke="#6b7280" stroke-width="1"></path>
    <path d="M250 0V420" stroke="#6b7280" stroke-width="1"></path>
    <path d="M520 0V420" stroke="#6b7280" stroke-width="1"></path>
    <path d="M800 0V420" stroke="#6b7280" stroke-width="1"></path>
    <path d="M1080 0V420" stroke="#6b7280" stroke-width="1"></path>
    <path d="M1350 0V420" stroke="#6b7280" stroke-width="1"></path>
  </g>

  <!-- Network Web -->
  <g>

    <!-- Major edges -->
    <path class="edge" d="M160 110 L330 170 L520 105 L760 185 L980 120 L1210 180 L1440 105">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="11s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge" d="M120 290 L330 170 L540 300 L760 185 L1010 295 L1210 180 L1480 285">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="13s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge" d="M330 170 L540 300 L760 185 L1010 295 L1210 180">
      <animate attributeName="stroke-dashoffset" from="0" to="-140" dur="9s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge" d="M520 105 L540 300 L760 185 L980 120 L1010 295">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="12s" repeatCount="indefinite"></animate>
    </path>

    <!-- Soft secondary edges -->
    <path class="edge-soft" d="M160 110 L540 300 L980 120 L1480 285">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="17s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M120 290 L520 105 L1010 295 L1440 105">
      <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="19s" repeatCount="indefinite"></animate>
    </path>

    <path class="edge-soft" d="M330 170 L760 185 L1210 180">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="15s" repeatCount="indefinite"></animate>
    </path>

    <!-- Nodes -->
    <circle class="node" cx="160" cy="110" r="4">
      <animate attributeName="r" values="4;7;4" dur="4.8s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.8s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="330" cy="170" r="5">
      <animate attributeName="r" values="5;8;5" dur="5.3s" begin="0.4s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5.3s" begin="0.4s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="520" cy="105" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.1s" begin="0.9s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="5.1s" begin="0.9s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="760" cy="185" r="6">
      <animate attributeName="r" values="6;10;6" dur="4.6s" begin="0.2s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="4.6s" begin="0.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="980" cy="120" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.7s" begin="1s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5.7s" begin="1s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="1210" cy="180" r="5">
      <animate attributeName="r" values="5;8;5" dur="5s" begin="0.6s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="0.6s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node" cx="1440" cy="105" r="4">
      <animate attributeName="r" values="4;7;4" dur="5.5s" begin="1.2s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="5.5s" begin="1.2s" repeatCount="indefinite"></animate>
    </circle>

    <circle class="node-muted" cx="120" cy="290" r="3"></circle>
    <circle class="node-muted" cx="540" cy="300" r="3"></circle>
    <circle class="node-muted" cx="1010" cy="295" r="3"></circle>
    <circle class="node-muted" cx="1480" cy="285" r="3"></circle>

  </g>

  <!-- Center dark glass panel -->
  <rect x="360" y="115" width="880" height="170" rx="6" fill="#08090b" opacity="0.54"></rect>
  <rect x="360" y="115" width="880" height="170" rx="6" stroke="#374151" stroke-opacity="0.45"></rect>

  <!-- Text -->
  <text x="800" y="182" text-anchor="middle" class="title">Malek M. Itani</text>
  <text x="800" y="222" text-anchor="middle" class="subtitle">APPLIED STATISTICS · COMPLEX SYSTEMS · AI RESEARCH</text>
  <text x="800" y="258" text-anchor="middle" class="caption">DATA-GENERATING PROCESSES · LATENT STRUCTURE · REGIME CHANGE</text>

  <!-- Small corner labels -->
  <text x="64" y="370" class="micro">SYSTEM STATE: PARTIALLY OBSERVED</text>
  <text x="1265" y="370" class="micro">INFERENCE UNDER NONSTATIONARITY</text>

  <!-- Bottom structural line -->
  <path d="M0 390 C260 360 480 410 800 385 C1120 360 1320 410 1600 382 V420 H0 Z" fill="#14171a" opacity="0.85"></path>

</svg>
